name: Publish verified debug APK v0.1.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-debug-v0.1.1.yml']

permissions: {}

concurrency:
  group: publish-boardlens-debug-v0.1.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Palmer-LOL/BoardLens'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_SHA: b644e3898b639310a0900650908a637c370f7a8a
      BUILD_RUN: '34706443746'
      ARTIFACT_ID: '10301921081'
      ARCHIVE_SHA256: afa95813e9b65e49d30626e069182957c4dce340c54aabd1f75c323e0f6a8e9d
    steps:
      - name: Verify build and download its exact artifact
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/boardlens-release"
          mkdir -p "$release_dir"
          cd "$release_dir"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg sha "$BUILD_SHA" '.conclusion == "success" and .status == "completed" and .head_sha == $sha and .head_branch == "main" and .event == "push" and .path == ".github/workflows/android.yml"' run.json > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/compare/$BUILD_SHA...$GITHUB_SHA" > comparison.json
          jq -e '.files | length == 1 and .[0].filename == ".github/workflows/publish-debug-v0.1.1.yml" and .[0].status == "added"' comparison.json > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact.json
          jq -e --arg sha "$BUILD_SHA" --arg digest "sha256:$ARCHIVE_SHA256" --argjson run "$BUILD_RUN" '.name == "BoardLens-debug" and .expired == false and .workflow_run.id == $run and .workflow_run.head_sha == $sha and .digest == $digest' artifact.json > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          printf '%s  artifact.zip\n' "$ARCHIVE_SHA256" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('artifact.zip') as archive:
              files = [entry for entry in archive.infolist() if not entry.is_dir()]
              assert len(files) == 1 and files[0].filename == 'app-debug.apk', 'Unexpected artifact contents'
              assert 0 < files[0].file_size < 50_000_000, 'Unexpected APK size'
              Path('BoardLens-0.1.1-debug.apk').write_bytes(archive.read(files[0]))
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose BoardLens-0.1.1-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging BoardLens-0.1.1-debug.apk > manifest.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = "package: name='lol.palmer.boardlens' versionCode='2' versionName='0.1.1'"
          assert expected in Path('manifest.txt').read_text(), 'Unexpected app identity or version'
          PY
          sha256sum BoardLens-0.1.1-debug.apk > SHA256SUMS
          cat SHA256SUMS
      - name: Publish debug prerelease with APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/boardlens-release"
          cat > release-notes.md <<'NOTES'
          Android 8.0+ debug build of BoardLens, with on-device calibrated chessboard recognition, an editable digital board, six-field FEN export, and the charcoal/ember interface.

          This APK is the unmodified artifact from [successful Android build #2](https://github.com/Palmer-LOL/BoardLens/actions/runs/34706443746), built from commit `b644e3898b639310a0900650908a637c370f7a8a`. The release tag also records the temporary publication workflow; application source is identical to that build.

          Download `BoardLens-0.1.1-debug.apk`. `SHA256SUMS` contains its SHA-256 checksum.

          Recognition is experimental and requires calibration photos of your own board and pieces. Physical-device acceptance and real-board accuracy testing remain pending.

          This APK uses the GitHub build's debug signing key. Replacing a debug APK signed elsewhere may require uninstalling the earlier app, which deletes its private photos and calibration.
          NOTES
          gh release create v0.1.1 BoardLens-0.1.1-debug.apk SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'BoardLens v0.1.1 (debug)' --notes-file release-notes.md \
            --draft --prerelease --latest=false
          gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json
          jq -e '([.assets[].name] | sort) == ["BoardLens-0.1.1-debug.apk", "SHA256SUMS"]' release-assets.json > /dev/null
          gh release edit v0.1.1 --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
